services:
  database:
    image: postgres:17-alpine
    container_name: reservation-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: reservationtdea
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - reservation-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reservationtdea"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  reservation-data:
